keymap:
  # Keyboard remapping is applied per-OS by
  # .chezmoiscripts/run_onchange_after_apply-keymap.sh.tmpl:
  #   - macOS: handled by Karabiner-Elements (config seeded via
  #     dot_config/karabiner/create_karabiner.json). hidutil was retired
  #     because it cannot remap the built-in keyboard per-device — see the
  #     Karabiner config for the Caps->Ctrl + built-in-only §<->` swap rules.
  #   - Linux: the xkb options below (Caps -> Ctrl only; the ISO §<->` swap is
  #     Mac-specific and not applied on Linux).
  linux_xkb_options:
    - "ctrl:nocaps"
