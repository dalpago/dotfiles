base:
  darwin:
    brews:
      - age
      - chezmoi
      - fzf
      - git
      - git-delta
      - gnupg
      - neovim
      - starship
      - tmux
      - uv
      - vim
      - zoxide
      - zsh
    casks:
      # NOTE: auto_updates casks (e.g. iterm2, pycharm) are intentionally NOT
      # listed here — they self-update via their own updaters, so `brew bundle`
      # cannot manage them and keeps re-attempting a blocked upgrade every run.
      # Update those from within each app (Check for Updates).
      - skim

  debian:
    apt:
      - age
      - fzf
      - git
      - gnupg
      - neovim
      - tmux
      - vim
      - zsh

categories:
  development:
    darwin:
      brews:
        - git-extras
        - git-filter-repo
        - node
        - pngpaste
        - python@3.13
        - sqlite
        - yarn
    debian:
      apt:
        - git-extras
        - python3
        - python3-pip
        - python3-venv
        - sqlite3
    npm: []

  cli-tools:
    darwin:
      brews:
        - bat
        - eza
        - fd
        - htop
        - mosh
        - pandoc
        - ripgrep
        - tea
        - vivid
    debian:
      apt:
        - bat
        - fd-find
        - htop
        - mosh
        - ripgrep
    npm:
      - "@mermaid-js/mermaid-cli"

  security:
    darwin:
      brews:
        - pass
        - wireguard-go
        - wireguard-tools
    debian:
      apt:
        - pass
    npm: []

  desktop-apps:
    darwin:
      casks:
        - libreoffice
    debian:
      apt:
        - zathura
    npm: []

  work:
    darwin:
      brews:
        - mysql-client
      casks:
        - microsoft-teams
        # pycharm removed — auto_updates cask (self-updating); see base casks note.
    debian:
      apt:
        - texlive-latex-base
        - texlive-latex-extra
    npm: []

uv_python:
  packages:
    - requests
    - pyyaml
